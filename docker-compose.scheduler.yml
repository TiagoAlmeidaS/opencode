# =============================================================================
# OpenCode Scheduler — Daemon autônomo: pipelines, activities, queue, RabbitMQ
# =============================================================================
# Sobe independentemente do backend de chat.
# Este compose CRIA a rede opencode-net (os demais composes a declaram external).
#
# Uso:
#   docker compose -f docker-compose.scheduler.yml up -d
#
# Com nginx opcional:
#   docker compose -f docker-compose.scheduler.yml --profile nginx up -d
#
# Dashboard/API: http://<host>:3000
# RabbitMQ:      http://<host>:15672 (management)
#
# Copie .env.server.example → .env.server e ajuste as variáveis antes de subir.
# =============================================================================

services:

  # ── OpenCode Server (scheduler + pipelines + activities) ─────────────────
  opencode-server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: opencode-server
    restart: unless-stopped
    env_file:
      - .env.server
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - server_data:/data
    environment:
      # Paths fixos no container; demais variáveis vêm de env_file: .env.server
      DB_PATH: /data/server.db
      OPENCODE_DB_PATH: /data/opencode.db
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - opencode-net
      - jarvis-network
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.http.routers.opencode-server.rule=Host(`${SERVER_DOMAIN:-opencode.localhost}`)"
      - "traefik.http.routers.opencode-server.entrypoints=web"
      - "traefik.http.services.opencode-server.loadbalancer.server.port=3000"

  # ── Autoheal — reinicia automaticamente containers marcados como unhealthy ─
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: opencode-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - opencode-net

  # ── RabbitMQ ─────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: opencode-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"          # AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-opencode}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-opencode_change_me}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-opencode}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - opencode-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`${RABBITMQ_DOMAIN:-rabbitmq.localhost}`)"
      - "traefik.http.routers.rabbitmq.entrypoints=web"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"

  # ── Nginx reverse proxy (opcional — remove se usar Traefik ou Caddy) ─────
  nginx:
    image: nginx:alpine
    container_name: opencode-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8090}:80"
    volumes:
      - ./infra/nginx/opencode-server.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - opencode-server
    networks:
      - opencode-net
    profiles:
      - nginx   # ativa somente com: docker compose --profile nginx up

volumes:
  server_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  # Este compose é o "dono" da rede — cria opencode-net para os demais se conectarem
  opencode-net:
    name: opencode-net
    driver: bridge
  # Rede compartilhada com docker-compose.vps.yml (Qdrant, Redis, Postgres)
  # Se não usar o compose vps, remova a seção abaixo e o `jarvis-network` nos services
  jarvis-network:
    external: true
    name: jarvis-network
