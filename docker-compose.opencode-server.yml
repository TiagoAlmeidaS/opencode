# =============================================================================
# OpenCode Backend — Interface de chat (UI + API de sessões)
# =============================================================================
# Sobe o backend de chat independentemente do scheduler.
# Requer que a rede opencode-net já exista (criada pelo docker-compose.scheduler.yml).
#
# Uso (scheduler já rodando):
#   docker compose -f docker-compose.opencode-server.yml up -d
#
# Uso completo (scheduler + chat juntos):
#   docker compose -f docker-compose.scheduler.yml -f docker-compose.opencode-server.yml up -d
#
# Chat + Board: http://<host>:4096
#
# Copie .env.server.example → .env.server e ajuste as variáveis antes de subir.
# =============================================================================

services:

  # ── Backend OpenCode (chat + /server) — serve a interface de chat na mesma URL ─
  opencode-backend:
    build:
      context: .
      dockerfile: Dockerfile.opencode-backend
    container_name: opencode-backend
    restart: unless-stopped
    ports:
      - "${OPENCODE_BACKEND_PORT:-4096}:4096"
    env_file:
      - .env.server
    environment:
      # Overrides fixos — as demais variáveis vêm de env_file: .env.server
      XDG_DATA_HOME: /data
    volumes:
      - opencode_backend_data:/data
    networks:
      - opencode-net

volumes:
  opencode_backend_data:
    driver: local

networks:
  # Rede criada pelo docker-compose.scheduler.yml — declarada aqui como external
  opencode-net:
    external: true
    name: opencode-net
